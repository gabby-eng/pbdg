<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Crossword!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --felt: #0B3D2E;
    --felt-deep: #062A20;
    --panel: #0F4A38;
    --panel-alt: #145843;
    --line: #1F6B52;
    --text: #F3EFE3;
    --muted: #9FC4B4;
    --gold: #E8B84B;
    --gold-bright: #FFD873;
    --error: #E37B6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #145843 0%, var(--felt) 45%, var(--felt-deep) 100%);
    min-height:100vh;
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:620px;margin:0 auto;min-height:100vh;padding:0 0 60px;}

  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);}

  .header{padding:28px 22px 10px;text-align:center;}
  .header h1{font-size:1.8rem;margin-bottom:6px;}
  .header .sub{color:var(--muted);font-size:0.85rem;line-height:1.5;max-width:440px;margin:0 auto;}

  .active-clue-bar{
    position:sticky;top:0;z-index:20;
    background:var(--panel-alt);border-bottom:1px solid var(--line);
    padding:10px 16px;text-align:center;font-family:'Space Mono',monospace;font-size:0.82rem;
    min-height:20px;
  }
  .active-clue-bar b{color:var(--gold-bright);}

  .board-wrap{padding:14px 10px 6px;display:flex;justify-content:center;}
  .board-frame{position:relative;width:100%;max-width:500px;}
  .board{
    display:grid;
    grid-template-columns:repeat(15, 1fr);
    grid-template-rows:repeat(15, 1fr);
    width:100%;aspect-ratio:1;
    background:var(--line);
    gap:1px;
    border:3px solid var(--gold);
    border-radius:4px;
    overflow:hidden;
  }
  .cell{
    background:var(--panel);
    position:relative;
  }
  .cell.black{background:var(--felt-deep);}
  .cell .num{
    position:absolute;top:1px;left:2px;font-size:0.42rem;font-family:'Space Mono',monospace;
    color:var(--muted);pointer-events:none;line-height:1;z-index:2;
  }
  .cell input{
    width:100%;height:100%;border:none;background:transparent;
    text-align:center;font-family:'Space Mono',monospace;font-size:0.85rem;font-weight:700;
    color:var(--text);outline:none;caret-color:var(--gold);text-transform:uppercase;
    padding-top:4px;
  }
  .cell.active-word{background:rgba(126,200,227,0.18);}
  .cell.active-cell{background:rgba(255,216,115,0.32);}
  .cell.wrong-flash input{color:var(--error);}

  .sparkle-overlay{position:absolute;inset:0;pointer-events:none;}
  .sparkle{
    position:absolute;font-size:1.2rem;color:var(--gold-bright);
    opacity:0;transform:scale(0.3) rotate(0deg);
    animation:sparkleTwinkle 1.8s ease-in-out infinite;
    text-shadow:0 0 8px rgba(255,216,115,0.8);
  }
  @keyframes sparkleTwinkle{
    0%{opacity:0;transform:scale(0.3) rotate(0deg);}
    30%{opacity:1;transform:scale(1.1) rotate(90deg);}
    60%{opacity:0.7;transform:scale(0.9) rotate(180deg);}
    100%{opacity:0;transform:scale(0.3) rotate(270deg);}
  }

  .status-note{
    text-align:center;font-family:'Space Mono',monospace;font-size:0.78rem;color:var(--muted);
    padding:10px 22px 0;
  }

  .win-banner{
    text-align:center;padding:22px 22px 6px;
  }
  .win-banner h2{color:var(--gold-bright);font-size:1.5rem;margin-bottom:4px;text-shadow:0 0 20px rgba(255,216,115,0.4);}
  .win-banner p{color:var(--muted);font-family:'Space Mono',monospace;font-size:0.82rem;}

  .clues-section{padding:20px 20px 0;}
  .clues-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:480px){
    .clues-columns{grid-template-columns:1fr;}
  }
  .clue-col-title{
    font-family:'Space Mono',monospace;font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--gold);margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px;
  }
  .clue-item{
    font-size:0.8rem;line-height:1.4;padding:5px 6px;border-radius:6px;cursor:pointer;
    display:flex;gap:6px;
  }
  .clue-item:hover{background:var(--panel-alt);}
  .clue-item.active{background:rgba(255,216,115,0.18);color:var(--gold-bright);}
  .clue-item.filled{color:var(--muted);}
  .clue-item .cnum{font-family:'Space Mono',monospace;font-weight:700;flex-shrink:0;min-width:20px;}

  .dev-buttons{text-align:center;padding-top:18px;}
  .dev-buttons button{
    font-family:'Space Mono',monospace;font-size:0.7rem;background:none;border:1px dashed var(--muted);
    color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;margin:0 4px;
  }

  @media (max-width:400px){
    .header h1{font-size:1.4rem;}
    .cell input{font-size:0.7rem;}
  }
</style>
</head>
<body>
<script src="achievements.js"></script>
<div id="app"></div>

<script>
const PUZZLE = {"grid": [["#", "P", "O", "K", "E", "#", "P", "U", "S", "H", "U", "P", "S", "#", "#"], ["N", "I", "N", "E", "#", "D", "#", "S", "P", "A", "C", "E", "B", "A", "R"], ["O", "R", "C", "#", "S", "I", "#", "D", "I", "L", "L", "#", "A", "#", "A"], ["L", "A", "A", "#", "A", "S", "H", "A", "K", "E", "#", "D", "R", "U", "M"], ["A", "T", "M", "#", "N", "C", "O", "#", "E", "#", "G", "A", "R", "#", "E"], ["W", "E", "E", "#", "D", "O", "#", "O", "B", "R", "A", "#", "O", "W", "N"], ["#", "#", "R", "O", "D", "#", "C", "H", "A", "I", "N", "#", "#", "A", "#"], ["L", "E", "A", "G", "U", "E", "O", "F", "L", "E", "G", "E", "N", "D", "S"], ["#", "V", "#", "#", "N", "E", "P", "A", "L", "#", "P", "R", "O", "#", "#"], ["W", "E", "D", "#", "E", "L", "A", "N", "#", "A", "L", "#", "M", "E", "T"], ["A", "#", "E", "O", "S", "#", "C", "#", "T", "E", "A", "#", "I", "F", "I"], ["L", "U", "M", "P", "#", "R", "E", "J", "O", "I", "N", "#", "N", "F", "T"], ["L", "#", "I", "#", "A", "I", "T", "A", "#", "O", "K", "#", "A", "O", "L"], ["E", "A", "S", "I", "N", "G", "I", "N", "#", "U", "#", "O", "T", "R", "E"], ["#", "#", "E", "N", "T", "I", "C", "E", "S", "#", "F", "R", "E", "T", "#"]], "positions": {"1": [0, 1], "2": [0, 2], "3": [0, 3], "4": [0, 6], "5": [0, 7], "6": [0, 8], "7": [0, 9], "8": [0, 10], "9": [0, 11], "10": [0, 12], "11": [1, 0], "12": [1, 5], "13": [1, 7], "14": [1, 14], "15": [2, 0], "16": [2, 4], "17": [2, 7], "18": [3, 0], "19": [3, 4], "20": [3, 6], "21": [3, 11], "22": [4, 0], "23": [4, 4], "24": [4, 10], "25": [5, 0], "26": [5, 4], "27": [5, 7], "28": [5, 9], "29": [5, 12], "30": [5, 13], "31": [6, 2], "32": [6, 3], "33": [6, 6], "34": [7, 0], "35": [7, 1], "36": [7, 5], "37": [7, 11], "38": [7, 12], "39": [8, 4], "40": [8, 10], "41": [9, 0], "42": [9, 2], "43": [9, 4], "44": [9, 9], "45": [9, 12], "46": [9, 13], "47": [9, 14], "48": [10, 2], "49": [10, 3], "50": [10, 8], "51": [10, 12], "52": [11, 0], "53": [11, 5], "54": [11, 7], "55": [11, 12], "56": [12, 4], "57": [12, 9], "58": [12, 12], "59": [13, 0], "60": [13, 3], "61": [13, 11], "62": [14, 2], "63": [14, 10]}, "across_answers": {"1": "POKE", "4": "PUSHUPS", "11": "NINE", "13": "SPACEBAR", "15": "ORC", "16": "SI", "17": "DILL", "18": "LAA", "19": "ASHAKE", "21": "DRUM", "22": "ATM", "23": "NCO", "24": "GAR", "25": "WEE", "26": "DO", "27": "OBRA", "29": "OWN", "31": "ROD", "33": "CHAIN", "34": "LEAGUEOFLEGENDS", "39": "NEPAL", "40": "PRO", "41": "WED", "43": "ELAN", "44": "AL", "45": "MET", "48": "EOS", "50": "TEA", "51": "IFI", "52": "LUMP", "53": "REJOIN", "55": "NFT", "56": "AITA", "57": "OK", "58": "AOL", "59": "EASINGIN", "61": "OTRE", "62": "ENTICES", "63": "FRET"}, "down_answers": {"1": "PIRATE", "2": "ONCAMERA", "3": "KE", "5": "USDA", "6": "SPIKEBALL", "7": "HALE", "8": "UCL", "9": "PE", "10": "SBARRO", "11": "NOLAW", "12": "DISCO", "14": "RAMEN", "16": "SANDDUNES", "20": "HO", "21": "DA", "24": "GANGPLANK", "27": "OHFAN", "28": "RIE", "30": "WAD", "32": "OG", "33": "COPACETIC", "35": "EVE", "36": "EEL", "37": "ER", "38": "NOMINATE", "41": "WALLE", "42": "DEMISE", "44": "AEIOU", "46": "EFFORT", "47": "TITLE", "49": "OP", "50": "TO", "53": "RIGI", "54": "JANE", "56": "ANT", "60": "IN", "61": "OR"}, "across_clues": {"1": "Invitation to respond or a delicious meal (if the acute accent is there)", "4": "What Gabby spent all her points on in the Run and Bun stream finale", "11": "L e g e n d A c h i e v e r _ _ _", "13": "Mos Eisley Cantina?", "15": "Humanoid brutish aggressive warrior from a movie franchise you haven't seen (sorry)", "16": "\u00bfTe est\u00e1s divirtiendo?", "17": "Common tzatziki ingredient", "18": "Po, Tinky Winky, Dipsy, and ___-___", "19": "Trembling or a treat", "21": "Munchlax's belly ___", "22": "$$$ machine", "23": "Supervises lower-ranking troops and managing daily operations", "24": "Animal fact! This animal can thrive in oxygen poor waters because they possess a primitive lung! They can be found in AB\u1e92\u00db and Animal Crossing games, too", "25": "Minute", "26": "\"___...There is no try.\"", "27": "Return of the ___ Dinn", "29": "Possess", "31": "Retinal cell", "33": "Ralph's, for one", "34": "In a way, it's all thanks to this <3", "39": "Borders China and India", "40": "For", "41": "Unionize?", "43": "Panache", "44": "Et ___.", "45": "Encountered", "48": "Goddess of dawn", "50": "Leaves for a drink", "51": "\"And ___ refuse?\"", "52": "Group (together)", "53": "What you do when the call keeps cutting out", "55": "Asset on a blockchain, for short", "56": "Subreddit where people seek counsel on whether they are in the right or in the wrong, briefly", "57": "Rammus", "58": "MSN rival", "59": "Entering gradually", "61": "Part of the Fed. Energy Regulatory Commission, one of its primary functions is supporting economic needs assessment for natural gas pipeline certificates applications", "62": "Tempts", "63": "Worry"}, "down_clues": {"1": "A fan-favorite this says 46-down", "2": "Captured, in a way", "3": "___ = 1/2 mv^2", "5": "Food stamp?", "6": "Sanctioned activity on Fridays from 4-6pm", "7": "Fit as a fiddle", "8": "LoL Worlds equivalent of football", "9": "A class that may usually be replaced by extracurriculars such as tennis or band", "10": "Food court or airport pizza chain", "11": "\"Congress shall make ___...\"", "12": "Fun and funky trait in Set 10", "14": "Akali loves a spicy one of these", "16": "Why Gabby has plastic sleds in the back of her car now", "20": "When doubled, a Hostess snack", "21": "\u0442\u0435\u0431\u0435 \u0432\u0435\u0441\u0435\u043b\u043e?", "24": "They always let it through once per Rumble... just once...", "27": "A popular exclamation in the south of France to express deep surprise, excitement, annoyance, or admiration", "28": "Short for a highly precise type of dry etching used in semiconductor manufacturing", "30": "Crumple (up)", "32": "A legend or pioneer, casually", "33": "*Listening to Payphone*", "35": "41-down resets and forgets her :'-(", "36": "Moray, e.g.", "37": "Represented by the blue Star of Life symbol or a red cross", "38": "Put forward", "41": "A sweet and electric moment from 35-down reboots his memory in the end :'-)", "42": "Undoing", "44": "\"Wheel of Fortune\" purchases", "46": "\"This ___ is no longer profitable!\"", "47": "Championship", "49": "Too strong or broken, casually", "50": "In the direction of", "53": "A mountain massif in the Alps surrounded by three different bodies of water: Lake Lucerne, Lake Zug and Lake Lauerz", "54": "Plain ___", "56": "Colony member", "60": "\"Are you ___?\"", "61": "Bitwise operator"}};

const N = 15;
const GRID_SOLUTION = PUZZLE.grid;

function isBlack(r,c){
  if (r<0||r>=N||c<0||c>=N) return true;
  return GRID_SOLUTION[r][c] === '#';
}

// build cell metadata: number label, across-entry-id, down-entry-id
const cellNumber = {};
for (const [num, pos] of Object.entries(PUZZLE.positions)){
  cellNumber[pos[0]+','+pos[1]] = num;
}

// figure out which across/down entry number each cell belongs to
const acrossOwner = {}; // "r,c" -> clue number
const downOwner = {};
for (const numStr of Object.keys(PUZZLE.across_answers)){
  const [r,c] = PUZZLE.positions[numStr];
  const word = PUZZLE.across_answers[numStr];
  for (let i=0;i<word.length;i++){
    acrossOwner[r+','+(c+i)] = numStr;
  }
}
for (const numStr of Object.keys(PUZZLE.down_answers)){
  const [r,c] = PUZZLE.positions[numStr];
  const word = PUZZLE.down_answers[numStr];
  for (let i=0;i<word.length;i++){
    downOwner[(r+i)+','+c] = numStr;
  }
}

let userGrid = [];
for (let r=0;r<N;r++){
  userGrid.push(new Array(N).fill(''));
}

let selected = null; // {r,c}
let direction = 'across'; // or 'down'
let wordConfirmed = false;

function devFillSolution(){
  for (let r=0;r<N;r++){
    for (let c=0;c<N;c++){
      if (!isBlack(r,c)) userGrid[r][c] = GRID_SOLUTION[r][c];
    }
  }
  render();
}
function devUnsolve(){
  for (let r=0;r<N;r++){
    for (let c=0;c<N;c++){
      userGrid[r][c] = '';
    }
  }
  render();
}

function currentAcrossNum(r,c){ return acrossOwner[r+','+c]; }
function currentDownNum(r,c){ return downOwner[r+','+c]; }

function activeClueNum(){
  if (!selected) return null;
  const {r,c} = selected;
  return direction === 'across' ? currentAcrossNum(r,c) : currentDownNum(r,c);
}

function wordCells(numStr, dir){
  const [r,c] = PUZZLE.positions[numStr];
  const cells = [];
  if (dir === 'across'){
    const word = PUZZLE.across_answers[numStr];
    for (let i=0;i<word.length;i++) cells.push([r, c+i]);
  } else {
    const word = PUZZLE.down_answers[numStr];
    for (let i=0;i<word.length;i++) cells.push([r+i, c]);
  }
  return cells;
}

function selectCell(r, c, preferDir){
  if (isBlack(r,c)) return;
  if (selected && selected.r === r && selected.c === c){
    // clicking same cell again toggles direction, if both exist
    const hasAcross = currentAcrossNum(r,c) !== undefined;
    const hasDown = currentDownNum(r,c) !== undefined;
    if (hasAcross && hasDown){
      direction = direction === 'across' ? 'down' : 'across';
    }
  } else {
    selected = {r,c};
    if (preferDir){
      direction = preferDir;
    } else {
      const hasAcross = currentAcrossNum(r,c) !== undefined;
      const hasDown = currentDownNum(r,c) !== undefined;
      if (direction === 'across' && !hasAcross && hasDown) direction = 'down';
      if (direction === 'down' && !hasDown && hasAcross) direction = 'across';
    }
  }
  render();
  focusCell(r,c);
}

function selectClue(numStr, dir){
  const [r,c] = PUZZLE.positions[numStr];
  direction = dir;
  selected = {r,c};
  render();
  focusCell(r,c);
}

function focusCell(r,c){
  const input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
  if (input) input.focus();
}

function isComplete(){
  for (let r=0;r<N;r++){
    for (let c=0;c<N;c++){
      if (!isBlack(r,c) && !userGrid[r][c]) return false;
    }
  }
  return true;
}

function isFullyCorrect(){
  for (let r=0;r<N;r++){
    for (let c=0;c<N;c++){
      if (!isBlack(r,c) && userGrid[r][c] !== GRID_SOLUTION[r][c]) return false;
    }
  }
  return true;
}

function moveNext(r, c){
  if (direction === 'across'){
    if (!isBlack(r, c+1)) { selected = {r, c:c+1}; }
  } else {
    if (!isBlack(r+1, c)) { selected = {r:r+1, c}; }
  }
}

function movePrev(r, c){
  if (direction === 'across'){
    if (!isBlack(r, c-1)) { selected = {r, c:c-1}; }
  } else {
    if (!isBlack(r-1, c)) { selected = {r:r-1, c}; }
  }
}

function onCellInput(el, r, c){
  let v = el.value.toUpperCase().replace(/[^A-Z]/g, '').slice(-1);
  el.value = v;
  userGrid[r][c] = v;
  if (v){
    moveNext(r,c);
  }
  render();
  if (selected) focusCell(selected.r, selected.c);
}

function goToAdjacentClue(delta){
  const dirAnswers = direction === 'across' ? PUZZLE.across_answers : PUZZLE.down_answers;
  const nums = Object.keys(dirAnswers).sort((a,b) => parseInt(a) - parseInt(b));
  const activeNum = activeClueNum();
  let idx = nums.indexOf(activeNum);
  if (idx === -1) idx = 0;
  const nextIdx = (idx + delta + nums.length) % nums.length;
  selectClue(nums[nextIdx], direction);
}

function onCellKeyDown(event, r, c){
  const key = event.key;
  if (key === 'Tab'){
    event.preventDefault();
    goToAdjacentClue(event.shiftKey ? -1 : 1);
    return;
  }
  if (key === 'Backspace'){
    event.preventDefault();
    if (userGrid[r][c]){
      userGrid[r][c] = '';
      render();
      focusCell(r, c);
    } else {
      movePrev(r,c);
      render();
      if (selected) focusCell(selected.r, selected.c);
    }
    return;
  }
  if (key === 'Delete'){
    event.preventDefault();
    userGrid[r][c] = '';
    render();
    focusCell(r, c);
    return;
  }
  if (key === 'ArrowRight'){ event.preventDefault(); if(!isBlack(r,c+1)){selected={r,c:c+1}; direction='across'; render(); focusCell(r,c+1);} return; }
  if (key === 'ArrowLeft'){ event.preventDefault(); if(!isBlack(r,c-1)){selected={r,c:c-1}; direction='across'; render(); focusCell(r,c-1);} return; }
  if (key === 'ArrowDown'){ event.preventDefault(); if(!isBlack(r+1,c)){selected={r:r+1,c}; direction='down'; render(); focusCell(r+1,c);} return; }
  if (key === 'ArrowUp'){ event.preventDefault(); if(!isBlack(r-1,c)){selected={r:r-1,c}; direction='down'; render(); focusCell(r-1,c);} return; }
  if (/^[a-zA-Z]$/.test(key)){
    // Handle letter entry directly here (not via the input event) so retyping the
    // same letter that's already in a cell still reliably advances to the next cell —
    // a maxlength=1 field doesn't fire an 'input' event when the value doesn't change.
    event.preventDefault();
    userGrid[r][c] = key.toUpperCase();
    selected = {r, c};
    moveNext(r, c);
    render();
    if (selected) focusCell(selected.r, selected.c);
  }
}

function sparkleHtml(){
  const positions = [
    {top:'2%', left:'2%'}, {top:'2%', left:'50%'}, {top:'2%', left:'96%'},
    {top:'50%', left:'-2%'}, {top:'50%', left:'100%'},
    {top:'96%', left:'2%'}, {top:'96%', left:'50%'}, {top:'96%', left:'96%'}
  ];
  return positions.map((p, i) =>
    `<div class="sparkle" style="top:${p.top}; left:${p.left}; animation-delay:${(i*0.15).toFixed(2)}s;">✦</div>`
  ).join('');
}

function render(){
  const app = document.getElementById('app');
  const complete = isComplete();
  const solved = complete && isFullyCorrect();
  if (solved && !wordConfirmed){
    window.PatAchievements.unlock('crosswordconqueror');
  }
  if (solved) wordConfirmed = true;

  const activeNum = activeClueNum();
  const activeCells = (selected && activeNum) ? wordCells(activeNum, direction).map(p=>p.join(',')) : [];
  const selKey = selected ? selected.r+','+selected.c : null;

  let boardHtml = '';
  for (let r=0;r<N;r++){
    for (let c=0;c<N;c++){
      if (isBlack(r,c)){
        boardHtml += `<div class="cell black"></div>`;
        continue;
      }
      const key = r+','+c;
      const classes = ['cell'];
      if (activeCells.includes(key)) classes.push('active-word');
      if (selKey === key) classes.push('active-cell');
      const num = cellNumber[key];
      const val = userGrid[r][c] || '';
      boardHtml += `<div class="${classes.join(' ')}">
        ${num ? `<div class="num">${num}</div>` : ''}
        <input type="text" maxlength="1" data-r="${r}" data-c="${c}" value="${val}"
          onclick="selectCell(${r},${c})"
          oninput="onCellInput(this, ${r}, ${c})"
          onkeydown="onCellKeyDown(event, ${r}, ${c})">
      </div>`;
    }
  }

  let activeClueText = '';
  if (activeNum){
    const clueText = direction === 'across' ? PUZZLE.across_clues[activeNum] : PUZZLE.down_clues[activeNum];
    activeClueText = `<b>${activeNum} ${direction === 'across' ? 'Across' : 'Down'}:</b> ${clueText}`;
  } else {
    activeClueText = 'Tap a square to begin.';
  }

  function clueListHtml(clues, answers, dir){
    return Object.keys(clues).sort((a,b)=>parseInt(a)-parseInt(b)).map(numStr => {
      const [r,c] = PUZZLE.positions[numStr];
      const word = answers[numStr];
      let filled = true;
      for (let i=0;i<word.length;i++){
        const rr = dir==='across'?r:r+i;
        const cc = dir==='across'?c+i:c;
        if (!userGrid[rr][cc]) { filled = false; break; }
      }
      const isActive = activeNum === numStr && direction === dir;
      return `<div class="clue-item ${isActive?'active':''} ${filled?'filled':''}" onclick="selectClue('${numStr}','${dir}')">
        <span class="cnum">${numStr}.</span><span>${clues[numStr]}</span>
      </div>`;
    }).join('');
  }

  const note = solved ? '' : (complete ? "Something doesn't match — check your answers." : "");

  const winHtml = solved ? `
    <div class="win-banner">
      <h2>Yay!!</h2>
      <p>Shout out to the 🐐 League of Legends</p>
      <div style="margin-top:10px;">
        <a href="gentle.html" style="font-family:'Space Mono',monospace;font-size:0.78rem;color:var(--gold-bright);text-decoration:underline;">Next puzzle set →</a>
      </div>
    </div>
  ` : '';

  app.innerHTML = `
    <div class="header">
      <div class="eyebrow">Puzzles for Patrick</div>
      <h1>Crossword!</h1>
      <div style="margin:14px auto 0;max-width:360px;padding:10px 12px;border:1px dashed var(--muted);border-radius:10px;">
        <div style="font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Dev nav — jump to any page</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">
          <a href="river.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">1 Suits</a>
          <a href="pit.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">2 Hollow</a>
          <a href="numbers.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">3 Sudoku</a>
          <a href="words.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">4 X-word</a>
          <a href="gentle.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">5 Water</a>
          <a href="loyal.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">6 Wars</a>
          <a href="observe.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">7 Disc</a>
          <a href="postletter.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">8 PS</a>
          <a href="spell.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">9 Spell</a>
          <a href="index.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">10 Lockbox</a>
          <a href="directive.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">11 Prologue</a>
        </div>
      </div>
    </div>
    <div class="active-clue-bar">${activeClueText}</div>
    <div class="board-wrap"><div class="board-frame"><div class="board">${boardHtml}</div>${solved ? `<div class="sparkle-overlay">${sparkleHtml()}</div>` : ''}</div></div>
    <div class="status-note">${note}</div>
    ${winHtml}
    <div class="clues-section">
      <div class="clues-columns">
        <div>
          <div class="clue-col-title">Across</div>
          ${clueListHtml(PUZZLE.across_clues, PUZZLE.across_answers, 'across')}
        </div>
        <div>
          <div class="clue-col-title">Down</div>
          ${clueListHtml(PUZZLE.down_clues, PUZZLE.down_answers, 'down')}
        </div>
      </div>
    </div>
    ${window.PatAchievements.isNewGamePlus() ? `
      <div style="text-align:center;padding-top:14px;">
        <button onclick="devFillSolution()" style="font-family:'Space Mono',monospace;font-size:0.75rem;background:var(--panel-alt);border:1px solid var(--gold);color:var(--gold-bright);padding:8px 16px;border-radius:999px;cursor:pointer;">Fill puzzle (New Game+)</button>
      </div>
    ` : ''}
    <div class="dev-buttons">
      <button onclick="devFillSolution()">DEV: Fill Solution (remove before gifting)</button>
      <button onclick="devUnsolve()">DEV: Unsolve (remove before gifting)</button>
    </div>
  `;

  if (selected){
    focusCell(selected.r, selected.c);
  }
}

render();
</script>
</body>
</html>
