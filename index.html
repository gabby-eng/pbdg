<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Puzzles for Patrick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --felt: #0B3D2E;
    --felt-deep: #062A20;
    --panel: #0F4A38;
    --panel-alt: #145843;
    --line: #1F6B52;
    --text: #F3EFE3;
    --muted: #9FC4B4;
    --gold: #E8B84B;
    --gold-bright: #FFD873;
    --error: #E37B6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #145843 0%, var(--felt) 45%, var(--felt-deep) 100%);
    min-height:100vh;
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }
  #app{max-width:420px;width:100%;padding:24px;text-align:center;}

  h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.7rem;margin:0 0 6px;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .lockbox{font-size:2.2rem;margin-bottom:14px;}

  .prompt{
    font-family:'Space Mono',monospace;font-size:0.9rem;color:var(--muted);
    margin:18px 0 24px;line-height:1.6;
  }

  .lockbox-frame{
    display:block;
    width:300px;
    background:linear-gradient(180deg, var(--panel-alt) 0%, var(--panel) 100%);
    border:3px solid var(--gold);
    border-radius:14px;
    padding:22px 20px 18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    margin:0 auto 20px;
    transition:transform 0.4s ease, box-shadow 0.4s ease;
  }
  .lockbox-frame::before{
    content:'';
    display:block;
    width:36px;height:14px;
    margin:0 auto 14px;
    background:var(--panel-alt);
    border:2px solid var(--gold);
    border-bottom:none;
    border-radius:6px 6px 0 0;
  }
  .lockbox-frame.unlocked{
    transform:scale(1.03);
    box-shadow:0 8px 30px rgba(255,216,115,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
    border-color:var(--gold-bright);
  }
  .digit-row{display:flex;gap:12px;justify-content:center;margin-bottom:0;}
  .digit-spinner{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .spin-btn{
    width:40px;height:32px;border-radius:8px;
    background:var(--panel-alt);border:1px solid var(--line);color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:0.9rem;user-select:none;
  }
  .spin-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .digit-box{
    width:48px;height:56px;border-radius:10px;
    background:var(--panel);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-weight:700;font-size:1.6rem;color:var(--gold-bright);
  }
  .digit-row.shake{animation:shake 0.4s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }

  .unlock-btn{
    font-family:'Space Mono',monospace;font-size:0.8rem;letter-spacing:0.05em;text-transform:uppercase;
    background:var(--gold);color:var(--felt-deep);border:none;font-weight:700;
    padding:10px 28px;border-radius:999px;cursor:pointer;
    margin-top:16px;
  }
  .unlock-btn:hover{background:var(--gold-bright);}

  .error-note{
    font-family:'Space Mono',monospace;font-size:0.78rem;color:var(--error);
    margin-top:14px;min-height:2.4em;line-height:1.3;
  }
</style>
</head>
<body>
<script src="achievements.js"></script>
<div id="app"></div>

<script>
const CODE = "1812";
let digits = [0, 0, 0, 0];
let unlocked = false;

function render(){
  const app = document.getElementById('app');

  const dialsHtml = `
    <div class="digit-row" id="digit-row">
      ${[0,1,2,3].map(i => `
        <div class="digit-spinner">
          <div class="spin-btn" onclick="changeDigit(${i}, 1)">▲</div>
          <div class="digit-box">${digits[i]}</div>
          <div class="spin-btn" onclick="changeDigit(${i}, -1)">▼</div>
        </div>
      `).join('')}
    </div>
    <button class="unlock-btn" onclick="tryUnlock()">Unlock</button>
    <div class="error-note" id="error-note"></div>
  `;

  const openedHtml = `
    <div style="font-size:1.3rem;color:var(--gold-bright);margin-bottom:6px;">Yay, it's you! GLHF!</div>
    <button class="unlock-btn" onclick="window.location.href='prologue.html'">Continue →</button>
  `;

  app.innerHTML = `
    <div class="eyebrow">Puzzles for Patrick</div>
    <h1>First things first.</h1>
    <div class="prompt">I need to make sure you are the Patrick this gift is intended for (and I'm sorry if you're not. Happy birthday though.)</div>
    <div class="lockbox-frame ${unlocked ? 'unlocked' : ''}" id="lockbox-frame">
      ${unlocked ? openedHtml : dialsHtml}
    </div>
    <div style="text-align:center;padding-top:18px;">
      <button onclick="devUnlock()" style="font-family:'Space Mono',monospace;font-size:0.7rem;background:none;border:1px dashed var(--muted);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;">
        DEV: Unlock (remove before gifting)
      </button>
    </div>
  `;
}

function devUnlock(){
  unlocked = true;
  render();
}

function changeDigit(i, delta){
  digits[i] = (digits[i] + delta + 10) % 10;
  document.getElementById('error-note').textContent = '';
  render();
}

let wrongAttempts = 0;

function tryUnlock(){
  const entered = digits.join('');
  if (entered === CODE){
    unlocked = true;
    render();
  } else {
    wrongAttempts++;
    const escalatingMessages = [
      "Nope. Try again!",
      "Maybe try a good lockbox code this time. ;)",
      "Patrick. I know you know what it is.",
      "Are you just looking for easter eggs?",
      "Well, good. You are rewarded for your efforts."
    ];
    const postAchievementMessages = [
      "You got the achievement already!",
      "Please.. please enter the right code.",
      "Please.....",
      "There are no more achievements on this page I promise.",
      "Paaatrickkkkk T^T"
    ];

    let message;
    if (wrongAttempts <= escalatingMessages.length){
      message = escalatingMessages[wrongAttempts - 1];
    } else {
      const cycleIndex = (wrongAttempts - escalatingMessages.length - 1) % postAchievementMessages.length;
      message = postAchievementMessages[cycleIndex];
    }

    const row = document.getElementById('digit-row');
    row.classList.add('shake');
    document.getElementById('error-note').textContent = message;
    setTimeout(() => { row.classList.remove('shake'); }, 400);

    if (wrongAttempts === 5){
      window.PatAchievements.unlock('metadiscovery');
      window.PatAchievements.unlock('curious');
    }
  }
}

render();
</script>
</body>
</html>
