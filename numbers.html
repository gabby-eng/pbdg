<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Digit Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --felt: #0B3D2E;
    --felt-deep: #062A20;
    --panel: #0F4A38;
    --panel-alt: #145843;
    --line: #1F6B52;
    --text: #F3EFE3;
    --muted: #9FC4B4;
    --gold: #E8B84B;
    --gold-bright: #FFD873;
    --error: #E37B6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #145843 0%, var(--felt) 45%, var(--felt-deep) 100%);
    min-height:100vh;
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 60px;}

  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);}

  .header{padding:32px 22px 14px;text-align:center;}
  .header h1{font-size:2rem;margin-bottom:8px;}
  .header .sub{color:var(--muted);font-size:0.9rem;line-height:1.5;max-width:420px;margin:0 auto;}

  .board-wrap{padding:18px 14px 6px;display:flex;justify-content:center;}
  .board{
    display:grid;
    grid-template-columns:repeat(9, 1fr);
    grid-template-rows:repeat(9, 1fr);
    width:100%;max-width:468px;aspect-ratio:1;
    background:var(--line);
    gap:1px;
    border:3px solid var(--gold);
    border-radius:6px;
    overflow:hidden;
  }
  .cell{
    background:var(--panel);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .cell input{
    width:100%;height:100%;border:none;background:transparent;
    text-align:center;font-family:'Space Mono',monospace;font-size:1.15rem;
    color:var(--text);outline:none;caret-color:var(--gold);
  }
  .cell.given input{color:var(--gold-bright);font-weight:700;pointer-events:none;}
  .cell.conflict{background:rgba(227,123,107,0.35);}
  .cell.highlight{background:rgba(126,200,227,0.12);}
  .cell.selected{background:rgba(255,216,115,0.22);}
  .cell.conflict.highlight{background:rgba(227,123,107,0.35);}
  .cell.same-number{background:rgba(255,127,180,0.2);}
  .cell.same-number.conflict{background:rgba(227,123,107,0.35);}
  .cell.border-right{border-right:2px solid var(--gold);}
  .cell.border-bottom{border-bottom:2px solid var(--gold);}

  .cell-container{
    width:100%;height:100%;outline:none;position:relative;
  }
  .candidate-grid{
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    width:100%;height:100%;
  }
  .candidate-slot{
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-size:0.55rem;
    color:transparent;cursor:pointer;user-select:none;
    transition:background 0.1s ease, color 0.1s ease;
  }
  .cell.selected .candidate-slot:hover{background:rgba(255,216,115,0.15);color:var(--muted);}
  .candidate-slot.active{color:var(--gold-bright);font-weight:700;}
  .cell-container:focus-within .candidate-grid{background:rgba(255,216,115,0.06);}
  .ghost-input{
    position:absolute;inset:0;width:100%;height:100%;
    opacity:0;border:none;background:transparent;padding:0;margin:0;
    pointer-events:none;font-size:16px;
  }

  .status-note{
    text-align:center;font-family:'Space Mono',monospace;font-size:0.78rem;color:var(--muted);
    padding:16px 22px 0;
  }

  .win-banner{
    text-align:center;padding:26px 22px;
  }
  .win-banner h2{color:var(--gold-bright);font-size:1.6rem;margin-bottom:6px;text-shadow:0 0 20px rgba(255,216,115,0.4);}
  .win-banner p{color:var(--muted);font-family:'Space Mono',monospace;font-size:0.85rem;}

  @media (max-width:400px){
    .header h1{font-size:1.6rem;}
    .cell input{font-size:0.95rem;}
  }

  .timer-bar{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:14px;font-family:'Space Mono',monospace;
  }
  .timer-display{font-size:1rem;color:var(--gold-bright);letter-spacing:0.06em;min-width:3.2em;text-align:right;}
  .timer-display.paused{color:var(--muted);}
  .timer-pause-btn{
    background:none;border:1px solid var(--line);color:var(--muted);
    font-family:'Space Mono',monospace;font-size:0.8rem;
    padding:4px 12px;border-radius:999px;cursor:pointer;
  }
  .timer-pause-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
</style>
</head>
<body>
<script src="achievements.js"></script>
<div id="app"></div>

<script>
// Verified: 28 givens, unique solution, and basic techniques (naked/hidden singles,
// pointing pairs) only fill 38/81 cells before getting stuck — genuinely Hard.
const GIVEN_PUZZLE = [
  [0,0,9,0,0,0,7,4,8],
  [0,5,8,0,0,0,0,9,0],
  [0,1,0,9,4,0,3,0,5],
  [3,0,4,0,0,0,0,0,0],
  [0,0,0,3,0,0,8,0,0],
  [0,2,0,0,1,0,0,0,0],
  [9,8,0,0,0,2,5,0,0],
  [0,0,7,0,0,0,0,0,0],
  [5,4,0,1,0,0,0,7,9]
];

// TEMPORARY — for testing only, remove before sending to Pat
const DEV_SOLUTION = [
  [6,3,9,2,5,1,7,4,8],
  [4,5,8,6,3,7,1,9,2],
  [7,1,2,9,4,8,3,6,5],
  [3,9,4,8,2,5,6,1,7],
  [1,7,5,3,6,9,8,2,4],
  [8,2,6,7,1,4,9,5,3],
  [9,8,1,4,7,2,5,3,6],
  [2,6,7,5,9,3,4,8,1],
  [5,4,3,1,8,6,2,7,9]
];
function devFillSolution(){
  grid = DEV_SOLUTION.map(row => row.slice());
  render();
}

let grid = GIVEN_PUZZLE.map(row => row.slice());

let timerSeconds = 0;
let timerIntervalId = null;
let timerRunning = false;
let timerManuallyPaused = false;
let puzzleSolved = false;

function formatTime(totalSeconds){
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function updateTimerDisplay(){
  const el = document.getElementById('timer-display');
  if (el) el.textContent = formatTime(timerSeconds);
}

function updateTimerButton(){
  const btn = document.getElementById('timer-pause-btn');
  if (btn) btn.textContent = timerRunning ? '⏸' : '▶';
  const display = document.getElementById('timer-display');
  if (display) display.classList.toggle('paused', !timerRunning);
}

function startTimer(){
  if (puzzleSolved || timerIntervalId) return;
  timerRunning = true;
  timerIntervalId = setInterval(() => {
    timerSeconds++;
    updateTimerDisplay();
  }, 1000);
  updateTimerButton();
}

function pauseTimer(){
  if (timerIntervalId){
    clearInterval(timerIntervalId);
    timerIntervalId = null;
  }
  timerRunning = false;
  updateTimerButton();
}

function togglePauseTimer(){
  if (puzzleSolved) return;
  if (timerRunning){
    timerManuallyPaused = true;
    pauseTimer();
  } else {
    timerManuallyPaused = false;
    startTimer();
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (timerRunning) pauseTimer();
  } else if (!timerManuallyPaused && !puzzleSolved){
    startTimer();
  }
});
window.addEventListener('blur', () => { if (timerRunning) pauseTimer(); });
window.addEventListener('focus', () => { if (!timerManuallyPaused && !puzzleSolved) startTimer(); });

function isGiven(r, c){
  return GIVEN_PUZZLE[r][c] !== 0;
}

function checkConflicts(){
  const conflicts = new Set();
  for (let i = 0; i < 9; i++){
    const rowSeen = {}, colSeen = {}, boxSeen = {};
    for (let j = 0; j < 9; j++){
      const rv = grid[i][j];
      if (rv){
        if (rowSeen[rv] !== undefined){ conflicts.add(i+","+j); conflicts.add(i+","+rowSeen[rv]); }
        rowSeen[rv] = j;
      }
      const cv = grid[j][i];
      if (cv){
        if (colSeen[cv] !== undefined){ conflicts.add(j+","+i); conflicts.add(colSeen[cv]+","+i); }
        colSeen[cv] = j;
      }
      const br = 3*Math.floor(i/3) + Math.floor(j/3);
      const bc = 3*(i%3) + (j%3);
      const bv = grid[br][bc];
      if (bv){
        const key = bv;
        if (boxSeen[key] !== undefined){
          conflicts.add(br+","+bc);
          const [pr,pc] = boxSeen[key];
          conflicts.add(pr+","+pc);
        }
        boxSeen[key] = [br,bc];
      }
    }
  }
  return conflicts;
}

function isComplete(){
  for (let r=0;r<9;r++) for (let c=0;c<9;c++) if (!grid[r][c]) return false;
  return true;
}

let candidates = {}; // "r,c" -> Set of digits 1-9
let selectedCell = null; // {r, c} or null
let everUsedCandidates = false;

function focusCell(r, c){
  const input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
  if (input && !input.disabled){ input.focus(); input.select(); return; }
  const container = document.querySelector(`.cell-container[data-r="${r}"][data-c="${c}"]`);
  if (container) container.focus();
}

function selectCell(r, c){
  selectedCell = { r, c };
  if (!timerRunning && !puzzleSolved){
    timerManuallyPaused = false;
    startTimer();
  }
  render();
  focusCell(r, c);
}

function render(){
  const app = document.getElementById('app');
  const conflicts = checkConflicts();
  const complete = isComplete();
  const solved = complete && conflicts.size === 0;
  if (solved && !everUsedCandidates){
    window.PatAchievements.unlock('lockedin');
  }
  if (solved && !puzzleSolved){
    puzzleSolved = true;
    pauseTimer();
    if (timerSeconds < 1800){
      window.PatAchievements.unlock('sudokuspeedster');
    }
  }

  let boardHtml = '';
  for (let r=0;r<9;r++){
    for (let c=0;c<9;c++){
      const given = isGiven(r,c);
      const val = grid[r][c] || '';
      const classes = ['cell'];
      if (given) classes.push('given');
      if (conflicts.has(r+","+c)) classes.push('conflict');
      if (selectedCell){
        const sameBox = Math.floor(r/3)===Math.floor(selectedCell.r/3) && Math.floor(c/3)===Math.floor(selectedCell.c/3);
        const selectedVal = grid[selectedCell.r][selectedCell.c];
        if (r === selectedCell.r && c === selectedCell.c){
          classes.push('selected');
        } else {
          if (r === selectedCell.r || c === selectedCell.c || sameBox){
            classes.push('highlight');
          }
          if (selectedVal && val === selectedVal){
            classes.push('same-number');
          }
        }
      }
      if (c===2 || c===5) classes.push('border-right');
      if (r===2 || r===5) classes.push('border-bottom');

      if (given || val){
        boardHtml += `<div class="${classes.join(' ')}" onclick="selectCell(${r},${c})">
          <input type="text" inputmode="numeric" maxlength="1" data-r="${r}" data-c="${c}"
            value="${val}" ${given ? 'disabled' : ''}
            oninput="onCellInput(this, ${r}, ${c})">
        </div>`;
      } else {
        const key = r + "," + c;
        const cellCands = candidates[key] || new Set();
        let slotsHtml = '';
        for (let d = 1; d <= 9; d++){
          const active = cellCands.has(d) ? 'active' : '';
          slotsHtml += `<div class="candidate-slot ${active}" onclick="toggleCandidate(${r},${c},${d})">${d}</div>`;
        }
        boardHtml += `<div class="${classes.join(' ')}" onclick="selectCell(${r},${c})">
          <div class="cell-container" tabindex="0" data-r="${r}" data-c="${c}"
            onkeydown="onEmptyCellKeyDown(event, ${r}, ${c})">
            <input class="ghost-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
              data-r="${r}" data-c="${c}" value=""
              oninput="onCellInput(this, ${r}, ${c})">
            <div class="candidate-grid">${slotsHtml}</div>
          </div>
        </div>`;
      }
    }
  }

  const note = solved
    ? ''
    : (complete ? "Something's off — check for conflicts." : "");

  const winHtml = solved ? `
    <div class="win-banner">
      <h2>Nice.</h2>
      <div style="margin-top:14px;">
        <a href="words.html" style="display:inline-block;font-family:'Space Mono',monospace;font-size:0.78rem;color:var(--gold-bright);text-decoration:underline;">Next puzzle set →</a>
      </div>
    </div>
  ` : '';

  app.innerHTML = `
    <div class="header">
      <div class="eyebrow">Puzzles for Patrick</div>
      <h1>What, you didn't think I'd put a sudoku in here?</h1>
      <div class="sub">Do you even know me at all?</div>
      <div class="timer-bar">
        <span class="timer-display ${timerRunning ? '' : 'paused'}" id="timer-display">${formatTime(timerSeconds)}</span>
        <button class="timer-pause-btn" id="timer-pause-btn" onclick="togglePauseTimer()" ${puzzleSolved ? 'disabled' : ''}>${timerRunning ? '⏸' : '▶'}</button>
      </div>
      <a href="pit.html" style="display:inline-block;margin-top:10px;font-family:'Space Mono',monospace;font-size:0.72rem;color:var(--muted);text-decoration:underline;">← Previous puzzle set</a>
      <div style="margin:14px auto 0;max-width:360px;padding:10px 12px;border:1px dashed var(--muted);border-radius:10px;">
        <div style="font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Dev nav — jump to any page</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">
          <a href="river.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">1 Suits</a>
          <a href="pit.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">2 Hollow</a>
          <a href="numbers.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">3 Sudoku</a>
          <a href="words.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">4 X-word</a>
          <a href="gentle.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">5 Water</a>
          <a href="loyal.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">6 Wars</a>
          <a href="observe.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">7 Disc</a>
          <a href="postletter.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">8 PS</a>
          <a href="spell.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">9 Spell</a>
          <a href="index.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">10 Lockbox</a>
          <a href="directive.html" style="font-family:'Space Mono',monospace;font-size:0.66rem;background:var(--panel-alt);border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:6px;text-decoration:none;">11 Prologue</a>
        </div>
      </div>
    </div>
    <div class="board-wrap"><div class="board">${boardHtml}</div></div>
    <div class="status-note">${note}</div>
    ${winHtml}
    <div style="text-align:center;padding-top:14px;">
      <button onclick="devFillSolution()" style="font-family:'Space Mono',monospace;font-size:0.7rem;background:none;border:1px dashed var(--muted);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;">
        DEV: Fill Solution (remove before gifting)
      </button>
    </div>
  `;
}

function onCellInput(el, r, c){
  let v = el.value.replace(/[^1-9]/g, '').slice(0,1);
  el.value = v;
  grid[r][c] = v ? parseInt(v) : 0;
  delete candidates[r+","+c];
  selectedCell = { r, c };
  render();
  if (!isComplete() || checkConflicts().size > 0){
    focusCell(r, c);
  }
}

function toggleCandidate(r, c, digit){
  const alreadySelected = selectedCell && selectedCell.r === r && selectedCell.c === c;
  if (!alreadySelected){
    // first click on this cell just selects it — doesn't toggle yet
    selectCell(r, c);
    return;
  }
  const key = r + "," + c;
  if (!candidates[key]) candidates[key] = new Set();
  if (candidates[key].has(digit)){
    candidates[key].delete(digit);
  } else {
    candidates[key].add(digit);
  }
  everUsedCandidates = true;
  window.PatAchievements.unlock('candidatenotation');
  render();
  focusCell(r, c);
}

function onEmptyCellKeyDown(event, r, c){
  // Digit entry is handled by the cell's ghost-input (see onCellInput) so both
  // physical and on-screen mobile keyboards work. This only needs to cover
  // backspace clearing pencil marks when there's no input value to trigger that.
  const key = event.key;
  if ((key === "Backspace" || key === "Delete") && !grid[r][c]){
    delete candidates[r+","+c];
    selectedCell = { r, c };
    render();
    focusCell(r, c);
  }
}

const ARROW_DELTAS = {
  ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]
};
document.addEventListener('keydown', (event) => {
  const delta = ARROW_DELTAS[event.key];
  if (!delta || !selectedCell) return;
  event.preventDefault();
  const nr = Math.min(8, Math.max(0, selectedCell.r + delta[0]));
  const nc = Math.min(8, Math.max(0, selectedCell.c + delta[1]));
  selectedCell = { r: nr, c: nc };
  render();
  focusCell(nr, nc);
});

render();
startTimer();
</script>
</body>
</html>
